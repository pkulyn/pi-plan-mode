name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # utils.ts imports @earendil-works/pi-tui (a peer dependency), so the
      # tests need the peer deps installed before they can run.
      - run: npm install --no-audit --no-fund
      - run: node --test "test/**/*.test.ts"
